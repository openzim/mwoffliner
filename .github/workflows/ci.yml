name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 12 * * *' # Run every day at 12:17 UTC

env:
  REDIS: 'redis://127.0.0.1:6379'
  S3_URL: ${{ secrets.S3_URL }}
  ZIMCHECK_PATH: $( find .. -name zimcheck )
  ZIMDUMP_PATH: $( find .. -name zimdump )
  KEEP_ZIMS: 1

jobs:
  prepare-zim-tools:
    runs-on: ubuntu-24.04
    outputs:
      x86_64-version: ${{ steps.x86_64-version.outputs.version }}
      aarch64-version: ${{ steps.aarch64-version.outputs.version }}

    steps:
      # An empty version means download.openzim.org could not be reached; the cache
      # steps below then fall back to the most recently cached build via restore-keys.
      - name: Resolving zim-tools version (x86_64)
        id: x86_64-version
        run: |
          url=$(curl -fsSI --max-time 15 -o /dev/null -w '%{redirect_url}' https://download.openzim.org/release/zim-tools/zim-tools_linux-x86_64.tar.gz) || url=""
          if [ -z "$url" ]; then
            echo "::warning::download.openzim.org is unreachable, will fall back to the most recently cached zim-tools (x86_64) build if available"
            version=""
          else
            version=$(basename "$url" .tar.gz)
            echo "Resolved zim-tools download URL: $url (version: $version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restoring zim-tools cache (x86_64)
        id: restore-x86_64
        uses: actions/cache/restore@v6
        with:
          path: zim-tools-x86_64
          key: zim-tools-x86_64-${{ steps.x86_64-version.outputs.version }}
          restore-keys: |
            zim-tools-x86_64-

      - name: Downloading zim-tools (x86_64)
        if: steps.x86_64-version.outputs.version != '' && steps.restore-x86_64.outputs.cache-hit != 'true'
        run: |
          rm -rf zim-tools-x86_64
          wget -qO- https://download.openzim.org/release/zim-tools/zim-tools_linux-x86_64.tar.gz | tar xvz
          mv zim-tools_linux-x86_64-* zim-tools-x86_64

      - name: Saving zim-tools cache (x86_64)
        if: steps.x86_64-version.outputs.version != '' && steps.restore-x86_64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: zim-tools-x86_64
          key: zim-tools-x86_64-${{ steps.x86_64-version.outputs.version }}

      - name: Checking zim-tools (x86_64) availability
        if: steps.x86_64-version.outputs.version == '' && steps.restore-x86_64.outputs.cache-matched-key == ''
        run: |
          echo "::error::download.openzim.org is unreachable and no previously cached zim-tools (x86_64) build is available"
          exit 1

      - name: Resolving zim-tools version (aarch64)
        id: aarch64-version
        run: |
          url=$(curl -fsSI --max-time 15 -o /dev/null -w '%{redirect_url}' https://download.openzim.org/release/zim-tools/zim-tools_linux-aarch64.tar.gz) || url=""
          if [ -z "$url" ]; then
            echo "::warning::download.openzim.org is unreachable, will fall back to the most recently cached zim-tools (aarch64) build if available"
            version=""
          else
            version=$(basename "$url" .tar.gz)
            echo "Resolved zim-tools download URL: $url (version: $version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restoring zim-tools cache (aarch64)
        id: restore-aarch64
        uses: actions/cache/restore@v6
        with:
          path: zim-tools-aarch64
          key: zim-tools-aarch64-${{ steps.aarch64-version.outputs.version }}
          restore-keys: |
            zim-tools-aarch64-

      - name: Downloading zim-tools (aarch64)
        if: steps.aarch64-version.outputs.version != '' && steps.restore-aarch64.outputs.cache-hit != 'true'
        run: |
          rm -rf zim-tools-aarch64
          wget -qO- https://download.openzim.org/release/zim-tools/zim-tools_linux-aarch64.tar.gz | tar xvz
          mv zim-tools_linux-aarch64-* zim-tools-aarch64

      - name: Saving zim-tools cache (aarch64)
        if: steps.aarch64-version.outputs.version != '' && steps.restore-aarch64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: zim-tools-aarch64
          key: zim-tools-aarch64-${{ steps.aarch64-version.outputs.version }}

      - name: Checking zim-tools (aarch64) availability
        if: steps.aarch64-version.outputs.version == '' && steps.restore-aarch64.outputs.cache-matched-key == ''
        run: |
          echo "::error::download.openzim.org is unreachable and no previously cached zim-tools (aarch64) build is available"
          exit 1

  unit-tests:
    runs-on: ubuntu-24.04
    needs: prepare-zim-tools

    steps:
      - name: Download codebase
        uses: actions/checkout@v6

      - name: Installing Node.JS
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Installing Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '6.x'

      - name: Restoring zim-tools cache
        uses: actions/cache/restore@v6
        with:
          path: zim-tools-x86_64
          key: zim-tools-x86_64-${{ needs.prepare-zim-tools.outputs.x86_64-version }}
          restore-keys: |
            zim-tools-x86_64-
          fail-on-cache-miss: true

      - name: Installing Node.JS project dependencies
        run: npm install

      - name: Running unit tests (w/coverage)
        if: ${{ github.event_name != 'schedule' }}
        run: npm run test:unit-coverage

      - name: Running unit tests (no coverage)
        if: ${{ github.event_name == 'schedule' }}
        run: npm run test:unit

      - name: Mailgun Action
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: vineetchoudhary/mailgun-action@v1.2
        with:
          api-key: ${{ secrets.MAILGUN_API_KEY }}
          domain: ${{ secrets.MAILGUN_DOMAIN }}
          from: 'mwoffliner-github-alert'
          to: ${{ secrets.CI_SCHEDULED_FAIL_EMAIL_TO }}
          subject: 'mwoffliner scheduled CI run FAILED (silent)'

      - name: Upload coverage results for unit tests
        uses: actions/upload-artifact@v6
        with:
          name: coverage-unit
          path: coverage/unit/coverage-final.json
          retention-days: 1

  e2e-tests:
    runs-on: ubuntu-24.04
    needs: prepare-zim-tools

    steps:
      - name: Download codebase
        uses: actions/checkout@v6

      - name: Installing Node.JS
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Installing Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '6.x'

      - name: Restoring zim-tools cache
        uses: actions/cache/restore@v6
        with:
          path: zim-tools-x86_64
          key: zim-tools-x86_64-${{ needs.prepare-zim-tools.outputs.x86_64-version }}
          restore-keys: |
            zim-tools-x86_64-
          fail-on-cache-miss: true

      - name: Installing Node.JS project dependencies
        run: npm install

      - name: Running e2e tests (w/coverage)
        if: ${{ github.event_name != 'schedule' }}
        run: npm run test:e2e-coverage

      - name: Running e2e tests (no coverage)
        if: ${{ github.event_name == 'schedule' }}
        run: npm run test:e2e

      - name: Uploading ZIM artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zims-e2e
          path: mwo-test-*/*.zim
          # keep scheduled (daily artifacts for 7 days, others only 1 day)
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}
          compression-level: 0

      - name: Mailgun Action
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: vineetchoudhary/mailgun-action@v1.2
        with:
          api-key: ${{ secrets.MAILGUN_API_KEY }}
          domain: ${{ secrets.MAILGUN_DOMAIN }}
          from: 'mwoffliner-github-alert'
          to: ${{ secrets.CI_SCHEDULED_FAIL_EMAIL_TO }}
          subject: 'mwoffliner scheduled CI run FAILED (silent)'

      - name: Upload coverage results for e2e tests
        uses: actions/upload-artifact@v6
        with:
          name: coverage-e2e
          path: coverage/e2e/coverage-final.json
          retention-days: 1

  upload-coverage:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    needs:
      - prepare-zim-tools
      - unit-tests
      - e2e-tests
    steps:
      - name: Download codebase
        uses: actions/checkout@v6

      - name: Installing Node.JS
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Restoring zim-tools cache
        uses: actions/cache/restore@v6
        with:
          path: zim-tools-x86_64
          key: zim-tools-x86_64-${{ needs.prepare-zim-tools.outputs.x86_64-version }}
          restore-keys: |
            zim-tools-x86_64-
          fail-on-cache-miss: true

      - name: Installing dependencies
        run: npm install

      - name: Download coverage results for unit tests
        uses: actions/download-artifact@v6
        with:
          name: coverage-unit
          path: coverage/unit/

      - name: Download coverage results for e2e tests
        uses: actions/download-artifact@v6
        with:
          name: coverage-e2e
          path: coverage/e2e/

      - name: Merge coverage results
        run: npm run codecov:merge

      - name: Uploading Codecov stats
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  unit-tests-arm64:
    runs-on: ubuntu-24.04-arm
    needs: prepare-zim-tools

    steps:
      - name: Download codebase
        uses: actions/checkout@v6

      - name: Installing Node.JS
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Installing Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '6.x'

      - name: Restoring zim-tools cache
        uses: actions/cache/restore@v6
        with:
          path: zim-tools-aarch64
          key: zim-tools-aarch64-${{ needs.prepare-zim-tools.outputs.aarch64-version }}
          restore-keys: |
            zim-tools-aarch64-
          fail-on-cache-miss: true

      - name: Installing Node.JS project dependencies
        run: npm install

      - name: Running unit tests (no coverage)
        run: npm run test:unit

  code-quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Download codebase
        uses: actions/checkout@v6

      - name: Installing Node.JS
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Installing Node.JS project dependencies
        run: |
          npm install
          npm i -g prettier
          npm i -g eslint

      - name: Running Prettier
        run: npm run format-check

      - name: Running ESLint
        run: npm run lint

      - name: Running TypeScript typecheck
        run: npm run typecheck

      - name: Validate Translations
        run: npm run test:i18n

  build-docker-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Download codebase
        uses: actions/checkout@v6

      - name: Ensure we can build the Docker image
        run: |
          docker build -t local-mwoffliner .

      - name: Ensure we can start the Docker image and display help
        run: |
          docker run --rm local-mwoffliner mwoffliner --help

  build-docker-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download codebase
        uses: actions/checkout@v6

      - name: Ensure we can build the Docker image
        run: |
          docker build -t local-mwoffliner .

      - name: Ensure we can start the Docker image and display help
        run: |
          docker run --rm local-mwoffliner mwoffliner --help
